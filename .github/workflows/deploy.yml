name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Read Sentry release
        id: version
        run: echo "release=$(node -p "require('./dist/version.json').release")" >> "$GITHUB_OUTPUT"
      # Readable stack traces in Sentry: upload the (hidden) source map for the inlined
      # script, built by inlineSourceMap() in vite.config.js. Release = __GIT_SHA__ (the build's commit).
      - name: Upload source maps to Sentry
        if: env.SENTRY_AUTH_TOKEN != ''
        uses: getsentry/action-release@v3
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
        with:
          release: ${{ steps.version.outputs.release }}
          environment: prod
          sourcemaps: dist
          url_prefix: 'app:///'
          inject: false # debug IDs only fit separate .js files; frames are rewritten in beforeSend
          set_commits: skip
      # Source maps are never public.
      - run: rm -f dist/*.map
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
